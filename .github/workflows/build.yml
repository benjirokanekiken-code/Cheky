name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Cheky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cheky-apk
          path: Cheky.apk

      # Publishes the APK as a GitHub Release so it can be downloaded straight from a phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Чеки — остання збірка
          files: Cheky.apk
          make_latest: true
